set -g prefix C-q
set -g prefix2 C-b
bind C-b send-prefix -2
bind C-q send-prefix

set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000

bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind w choose-window
bind -n PPage previous-window
bind -n NPage next-window

bind 0 select-window -t :0
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind -n Home split-window -h -c "#{pane_current_path}"
bind -n End split-window -v -c "#{pane_current_path}"

bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R
bind o select-pane -t '{next}'
bind q display-panes
bind x kill-pane

bind z resize-pane -Z
bind l next-layout
bind r select-layout
bind -r S-Left resize-pane -L 3
bind -r S-Right resize-pane -R 3
bind -r S-Up resize-pane -U 3
bind -r S-Down resize-pane -D 3

bind S command-prompt -p "save session as:" "new-session -d -s '%%'"
bind R choose-tree -s
