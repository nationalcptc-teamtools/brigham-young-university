# BYU CPTC kitty config — mirrors this team's own kitty.conf (ctrl+q prefix,
# same letters for the same actions) so muscle memory carries over from the
# tmux layout this replaced. Kitty's tabs/windows/layouts stand in for tmux's
# windows/panes, so there's no multiplexer running underneath anymore.
#
# Copy/paste is deliberately left at kitty's own defaults (select-to-copy,
# shift+insert / middle-click to paste) -- no custom mouse_map here.

shell /usr/bin/zsh

# No bell sound/flash (e.g. backspacing past start of line).
enable_audio_bell no
visual_bell_duration 0

# Tmux-like local multiplexing.
# Kitty tabs act like tmux windows; Kitty windows act like tmux panes.
enabled_layouts splits,tall,stack

# Prefix and basic tab/session navigation.
map ctrl+q>ctrl+q send_key ctrl+q
map ctrl+q>c new_tab_with_cwd
map ctrl+q>n next_tab
map ctrl+q>p previous_tab
map ctrl+q>w select_tab
map page_up previous_tab
map page_down next_tab
map ctrl+q>0 goto_tab 1
map ctrl+q>1 goto_tab 2
map ctrl+q>2 goto_tab 3
map ctrl+q>3 goto_tab 4
map ctrl+q>4 goto_tab 5
map ctrl+q>5 goto_tab 6
map ctrl+q>6 goto_tab 7
map ctrl+q>7 goto_tab 8
map ctrl+q>8 goto_tab 9

# Pane creation and navigation.
map ctrl+q>v launch --cwd=current --location=vsplit
map ctrl+q>s launch --cwd=current --location=hsplit
map home combine : goto_layout splits : launch --cwd=current --location=vsplit
map end combine : goto_layout splits : launch --cwd=current --location=hsplit
map ctrl+q>left neighboring_window left
map ctrl+q>down neighboring_window bottom
map ctrl+q>up neighboring_window top
map ctrl+q>right neighboring_window right
map ctrl+q>o next_window
map ctrl+q>q focus_visible_window
map ctrl+q>x close_window

# Pane zoom and layout controls.
map ctrl+q>z toggle_layout stack
map ctrl+q>l next_layout
map ctrl+q>r resize_window reset
map ctrl+q>shift+left resize_window narrower 3
map ctrl+q>shift+right resize_window wider 3
map ctrl+q>shift+up resize_window taller 3
map ctrl+q>shift+down resize_window shorter 3

# Save and switch between reusable Kitty layouts.
# Sessions recreate tabs, panes, working directories, and shells; they are not
# a live detach/reattach store for running processes the way tmux sessions are.
map ctrl+q>shift+s save_as_session --base-dir ~/.local/share/kitty/sessions
map ctrl+q>shift+r goto_session ~/.local/share/kitty/sessions

# Light theme to match this box's light-terminal dircolors/prompt setup.
background #FFFFFF
foreground #000000
cursor #000000
color0  #000000
color1  #AA0000
color2  #00AA00
color3  #AA5500
color4  #0000AA
color5  #AA00AA
color6  #00AAAA
color7  #AAAAAA
color8  #555555
color9  #FF5555
color10 #55FF55
color11 #FFFF55
color12 #5555FF
color13 #FF55FF
color14 #55FFFF
color15 #FFFFFF
